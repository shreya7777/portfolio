<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shreya Pabalkar — UX Researcher &amp; Designer</title>
  <meta name="description" content="Shreya Pabalkar — a UX Designer turning bizarre ideas into beautifully organized realities." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=26" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>" />
</head>
<body>

  <div class="page">

    <!-- ============ HEADER ============ -->
    <header class="site-header">
      <a class="logo" href="#home" data-nav="home">
        <img src="Homepage/mylogo.png" alt="Shreya Pabalkar" />
      </a>

      <nav class="tabs" aria-label="Main">
        <button class="tab is-active" data-tab="home">All</button>
        <button class="tab" data-tab="about">About</button>
        <button class="tab" data-tab="work">Work</button>
      </nav>

      <div class="socials">
        <a data-social="linkedin" href="#" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zM8.5 18H6V9.5h2.5V18zM7.2 8.4a1.45 1.45 0 1 1 0-2.9 1.45 1.45 0 0 1 0 2.9zM18 18h-2.5v-4.4c0-1.1-.4-1.8-1.4-1.8-.8 0-1.2.5-1.4 1-.1.2-.1.5-.1.7V18h-2.5V9.5h2.5v1.1c.3-.5 1-1.3 2.3-1.3 1.7 0 3 1.1 3 3.5V18z"/></svg>
        </a>
        <a data-social="email" href="#" aria-label="Email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
        </a>
        <a data-social="instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
        </a>
      </div>
    </header>

    <!-- ============ VIEW: HOME ============ -->
    <main id="view-home" class="view">

      <div class="bento-grid">

        <!-- photo -->
        <div class="card box-b card-photo">
          <img id="hero-photo" alt="Shreya Pabalkar" />
        </div>

        <!-- about + resume -->
        <div class="card box-a card-intro">
          <a class="resume-paper" id="resume-link" data-resume href="#" target="_blank" rel="noopener" aria-label="Open resume PDF">
            <svg class="paperclip" viewBox="0 0 24 34" aria-hidden="true">
              <path d="M8 3 v20 a4 4 0 0 0 8 0 V7 a2.4 2.4 0 0 0 -4.8 0 v15"
                    fill="none" stroke="#1B264F" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
            <span class="paper-title">Resume</span>
            <span class="paper-line"></span>
            <span class="paper-line"></span>
            <span class="paper-line short"></span>
          </a>
          <div class="intro-body">
            <p class="card-label" id="hero-label">Who is she?</p>
            <h1 id="hero-title"></h1>
            <p class="intro-tagline" id="hero-tagline"></p>
            <p class="intro-about" id="hero-about"></p>
          </div>
        </div>

        <!-- map -->
        <div class="card box-a card-map">
          <img src="Homepage/atlanta-map.jpg" alt="Map of Atlanta, GA" />
          <span class="map-label" id="map-label">Atlanta, GA</span>
        </div>

        <!-- tools -->
        <div class="card box-b card-tools">
          <p class="card-label">Tools I use</p>
          <div class="tools-row" id="tools-home">
            <span class="mug-wrap" id="mug-wrap" tabindex="0" role="img" aria-label="Coffee mug">
              <span class="steam" aria-hidden="true"><span></span><span></span><span></span></span>
              <img id="hero-mug" alt="" />
            </span>
          </div>
        </div>

        <!-- chat -->
        <div class="card chat-card card-chat" id="chat-card">
          <div class="chat-thread" id="chat-thread"></div>
          <form class="chat-input-row" id="chat-form" autocomplete="off">
            <input class="chat-input" id="chat-input" type="text" placeholder="iMessage" maxlength="180" aria-label="Type a message" />
            <button class="chat-send" id="chat-send" type="submit" aria-label="Send message" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
          </form>
        </div>
      </div>

      <section class="brands-section">
        <div class="card box-white card-brands">
          <p class="card-label" id="brands-label">Brands that trust me</p>
          <div class="marquee">
            <div class="marquee-track" id="brands"></div>
          </div>
        </div>
      </section>

      <div class="projects-masonry">
        <div class="masonry-col" id="projects-home-col1"></div>
        <div class="masonry-col" id="projects-home-col2"></div>
      </div>
    </main>

    <!-- ============ VIEW: ABOUT ============ -->
    <main id="view-about" class="view" hidden>
      <div class="about-simple">
        <div class="card box-white card-story" id="about-story"></div>
        <div class="about-secondary">
          <div class="card box-a card-carousel" id="about-carousel"></div>
          <div class="card box-b card-spotify" id="about-spotify"></div>
        </div>
      </div>
    </main>

    <!-- ============ VIEW: WORK ============ -->
    <main id="view-work" class="view" hidden>
      <div class="card box-white card-timeline">
        <div class="timeline" id="timeline"></div>
      </div>
      <div class="projects-grid" id="projects-work"></div>
      <section class="testimonials-section">
        <div class="testimonials-grid" id="testimonials"></div>
      </section>
    </main>

    <!-- ============ VIEW: PROJECT DETAIL ============ -->
    <main id="view-project" class="view" hidden>
      <a class="back-link" href="#work" data-nav="work">← All work</a>
      <div class="project-layout no-nav" id="project-layout">
        <nav class="project-nav" id="project-nav" hidden>
          <ul id="project-nav-list"></ul>
        </nav>
        <div class="card box-white card-project-detail">
          <p class="card-label" id="project-category"></p>
          <h1 id="project-title"></h1>
          <div class="project-body" id="project-body"></div>
          <div class="project-gallery" id="project-gallery"></div>
        </div>
      </div>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="site-footer">
      <div class="footer-top">
        <div>
          <h2 id="chat-title">Hit me up if you want to chat about</h2>
          <div class="chat-chips" id="chat-chips"></div>
        </div>
        <a class="logo footer-logo" href="#home" data-nav="home">
          <img src="Homepage/mylogo.png" alt="Shreya Pabalkar" />
        </a>
      </div>
      <div class="footer-bottom">
        <div class="socials">
          <a data-social="linkedin" href="#" target="_blank" rel="noopener" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zM8.5 18H6V9.5h2.5V18zM7.2 8.4a1.45 1.45 0 1 1 0-2.9 1.45 1.45 0 0 1 0 2.9zM18 18h-2.5v-4.4c0-1.1-.4-1.8-1.4-1.8-.8 0-1.2.5-1.4 1-.1.2-.1.5-.1.7V18h-2.5V9.5h2.5v1.1c.3-.5 1-1.3 2.3-1.3 1.7 0 3 1.1 3 3.5V18z"/></svg>
          </a>
          <a data-social="email" href="#" aria-label="Email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
          </a>
          <a data-social="instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
          </a>
        </div>
        <nav class="footer-links">
          <a href="#work" data-nav="work">Projects</a>
          <a href="#about" data-nav="about">About</a>
          <a data-resume href="#" target="_blank" rel="noopener">Resume</a>
        </nav>
      </div>
    </footer>
  </div>

  <script src="script.js?v=23"></script>
</body>
</html>
