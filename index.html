<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shreya Pabalkar — UX Researcher &amp; Designer</title>
  <meta name="description" content="Shreya Pabalkar — a UX Designer turning bizarre ideas into beautifully organized realities." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>" />
</head>
<body>

  <div class="page">

    <!-- ============ HEADER ============ -->
    <header class="site-header">
      <a class="logo" href="#home" data-nav="home">shreya<span class="logo-dot">.</span></a>

      <nav class="tabs" aria-label="Main">
        <button class="tab is-active" data-tab="home">All</button>
        <button class="tab" data-tab="about">About</button>
        <button class="tab" data-tab="work">Work</button>
      </nav>

      <div class="socials">
        <a data-social="linkedin" href="#" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zM8.5 18H6V9.5h2.5V18zM7.2 8.4a1.45 1.45 0 1 1 0-2.9 1.45 1.45 0 0 1 0 2.9zM18 18h-2.5v-4.4c0-1.1-.4-1.8-1.4-1.8-.8 0-1.2.5-1.4 1-.1.2-.1.5-.1.7V18h-2.5V9.5h2.5v1.1c.3-.5 1-1.3 2.3-1.3 1.7 0 3 1.1 3 3.5V18z"/></svg>
        </a>
        <a data-social="email" href="#" aria-label="Email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
        </a>
        <a data-social="instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
        </a>
      </div>
    </header>

    <!-- ============ VIEW: HOME ============ -->
    <main id="view-home" class="view">

      <div class="bento-hero">
        <div class="card c-cream card-intro">
          <a class="resume-paper" data-resume href="#" target="_blank" rel="noopener" aria-label="Open resume PDF">
            <svg class="paperclip" viewBox="0 0 24 34" aria-hidden="true">
              <path d="M8 3 v20 a4 4 0 0 0 8 0 V7 a2.4 2.4 0 0 0 -4.8 0 v15"
                    fill="none" stroke="#7c8794" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
            <span class="paper-title">Resume</span>
            <span class="paper-line"></span>
            <span class="paper-line"></span>
            <span class="paper-line short"></span>
            <span class="paper-open">Open ↗</span>
          </a>
          <p class="card-label" id="hero-label">About</p>
          <h1 id="hero-title"></h1>
          <p class="intro-tagline" id="hero-tagline"></p>
          <p class="intro-about" id="hero-about"></p>
          <img id="hero-photo" class="hero-cutout" alt="Cutout portrait of Shreya Pabalkar" />
        </div>

        <div class="card card-map">
          <svg viewBox="0 0 220 128" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map">
            <rect width="220" height="128" fill="#eef3ec"/>
            <path d="M-10 30 C 50 20, 90 55, 230 38" stroke="#fbd89a" stroke-width="7" fill="none"/>
            <path d="M-10 82 C 60 95, 140 70, 230 92" stroke="#f9c46b" stroke-width="9" fill="none"/>
            <path d="M60 -10 C 55 40, 75 90, 62 140" stroke="#ffffff" stroke-width="5" fill="none"/>
            <path d="M150 -10 C 145 50, 165 80, 155 140" stroke="#ffffff" stroke-width="5" fill="none"/>
            <path d="M-10 55 L 230 62" stroke="#ffffff" stroke-width="3" fill="none"/>
            <path d="M20 128 C 40 90, 90 110, 120 128 Z" fill="#cfe6cd"/>
            <path d="M170 0 C 190 20, 215 10, 220 0 Z" fill="#cfe6cd"/>
            <rect x="30" y="34" width="14" height="10" rx="2" fill="#dde5da"/>
            <rect x="120" y="40" width="16" height="11" rx="2" fill="#dde5da"/>
            <rect x="85" y="95" width="14" height="10" rx="2" fill="#dde5da"/>
            <g transform="translate(110 52)">
              <path d="M0 -18 a12 12 0 0 1 12 12 c0 8 -12 20 -12 20 s-12 -12 -12 -20 a12 12 0 0 1 12 -12z" fill="#e2445c"/>
              <circle cx="0" cy="-6" r="5" fill="#fff"/>
            </g>
            <text id="map-label" x="110" y="118" text-anchor="middle" font-family="Nunito, sans-serif" font-size="12" font-weight="700" fill="#5f7476"></text>
          </svg>
        </div>

        <div class="card c-white card-tools">
          <p class="card-label">Tools I use</p>
          <div class="tools-row" id="tools-home"></div>
          <img id="hero-mug" class="mug-pop" alt="Coffee mug illustration" hidden />
        </div>

        <div class="card c-blue card-skills">
          <p class="card-label">Skills</p>
          <div class="skills-col" id="skills"></div>
        </div>
      </div>

      <section class="brands-section">
        <div class="section-banner">
          <span id="brands-label">Brands that trust me</span>
          <span class="banner-arrow">↗</span>
        </div>
        <div class="marquee">
          <div class="marquee-track" id="brands"></div>
        </div>
      </section>

      <div class="projects-grid" id="projects-home"></div>

      <div class="card c-orange card-how">
        <p class="card-label" id="how-label">How I shape user experiences</p>
        <div class="how-cols" id="how"></div>
      </div>
    </main>

    <!-- ============ VIEW: ABOUT ============ -->
    <main id="view-about" class="view" hidden>
      <div class="about-grid">
        <div class="about-main">
          <div class="card c-cream card-story" id="about-story"></div>
          <div class="card c-white card-exp">
            <p class="card-label">Experience</p>
            <ul class="exp-list" id="about-experience"></ul>
          </div>
          <div class="card c-lavender card-vision" id="about-vision"></div>
        </div>
        <aside class="about-side">
          <div class="card c-yellow">
            <p class="card-label">What I do best</p>
            <p class="side-blurb" id="about-best"></p>
          </div>
          <div class="card c-white">
            <p class="card-label">Tools I use</p>
            <div class="tools-row" id="tools-about"></div>
          </div>
          <div class="card c-white card-gallery" id="gallery-hobbies"></div>
          <div class="card c-white card-gallery" id="gallery-outdoor"></div>
          <div class="card c-green">
            <p class="card-label">More work</p>
            <ul class="exp-list compact" id="about-morework"></ul>
          </div>
        </aside>
      </div>
    </main>

    <!-- ============ VIEW: WORK ============ -->
    <main id="view-work" class="view" hidden>
      <div class="projects-grid" id="projects-work"></div>
      <div class="card c-cream card-timeline">
        <div class="timeline" id="timeline"></div>
      </div>
    </main>

    <!-- ============ VIEW: PROJECT DETAIL ============ -->
    <main id="view-project" class="view" hidden>
      <a class="back-link" href="#work" data-nav="work">← All work</a>
      <div class="card c-cream card-project-detail">
        <p class="card-label" id="project-category"></p>
        <h1 id="project-title"></h1>
        <div class="project-body" id="project-body"></div>
        <div class="project-gallery" id="project-gallery"></div>
      </div>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="site-footer">
      <div class="footer-top">
        <div>
          <h2 id="chat-title">Hit me up if you want to chat about</h2>
          <div class="chat-chips" id="chat-chips"></div>
        </div>
        <a class="logo footer-logo" href="#home" data-nav="home">shreya<span class="logo-dot">.</span></a>
      </div>
      <div class="footer-bottom">
        <div class="socials">
          <a data-social="linkedin" href="#" target="_blank" rel="noopener" aria-label="LinkedIn">
            <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zM8.5 18H6V9.5h2.5V18zM7.2 8.4a1.45 1.45 0 1 1 0-2.9 1.45 1.45 0 0 1 0 2.9zM18 18h-2.5v-4.4c0-1.1-.4-1.8-1.4-1.8-.8 0-1.2.5-1.4 1-.1.2-.1.5-.1.7V18h-2.5V9.5h2.5v1.1c.3-.5 1-1.3 2.3-1.3 1.7 0 3 1.1 3 3.5V18z"/></svg>
          </a>
          <a data-social="email" href="#" aria-label="Email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
          </a>
          <a data-social="instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
          </a>
        </div>
        <nav class="footer-links">
          <a href="#work" data-nav="work">Projects</a>
          <a href="#about" data-nav="about">About</a>
          <a data-resume href="#" target="_blank" rel="noopener">Resume</a>
        </nav>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
